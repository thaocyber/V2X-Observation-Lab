<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330"><rect width="1100" height="330" rx="18" fill="#0a121e"/><g font-family="sans-serif" fill="#e2edf5"><text x="38" y="48" font-size="25">V2X Observation Lab · What can the receiver really know?</text><g font-size="19"><rect x="35" y="82" width="300" height="150" rx="12" fill="#121f30" stroke="#67e8c3"/><text x="58" y="118" fill="#67e8c3">A · Synthetic ground truth</text><text x="58" y="155">p(t) = (−30 + 3t, 0)</text><text x="58" y="193" font-size="15">Teaching reference only</text><text x="347" y="161">→</text><rect x="395" y="82" width="300" height="150" rx="12" fill="#121f30" stroke="#ffc477"/><text x="418" y="118" fill="#ffc477">A′ · Reported position</text><text x="418" y="155">p′(t) = p(t) + c(t)</text><text x="418" y="193" font-size="15">One message per second</text><text x="707" y="161">→</text><rect x="755" y="82" width="310" height="150" rx="12" fill="#121f30" stroke="#7eafff"/><text x="777" y="118" fill="#7eafff">B · Receiver observation</text><text x="777" y="155">Hold last arrived claim</text><text x="777" y="193" font-size="15">Delay + omissions limit visibility</text></g><text x="38" y="276" font-size="18">Equal differences do not prove a correct absolute position.</text><text x="38" y="307" font-size="14" fill="#a6b9c9">Authored synthetic examples · No RF or live vehicles · No detector scores</text></g></svg>