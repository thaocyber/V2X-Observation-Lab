<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A deterministic synthetic playground for constant-position-offset V2X messages."><title>V2X Observation Lab · TCyberTrust</title><link rel="stylesheet" href="style.css"></head><body>
<header><a href="./">TCyberTrust <span>/ V2X Observation Lab</span></a><label>Ngôn ngữ / Language <select id="language"><option value="vi">Tiếng Việt</option><option value="en">English</option></select></label></header>
<main><section class="intro"><p class="eyebrow">V2X OBSERVATION LAB / PUBLIC PLAYGROUND</p><h1 data-vi="Một chuyển động. Ba góc nhìn." data-en="One movement. Three perspectives."></h1><p data-vi="Tạo độ lệch vị trí, theo dõi bản tin và khám phá điều xe nhận quan sát được." data-en="Create a position offset, follow the messages, and explore what a receiver observes."></p><div class="badge" data-vi="DỮ LIỆU TỔNG HỢP · TÁI HIỆN ĐƯỢC · KHÔNG CHẤM ĐIỂM MÔ HÌNH" data-en="SYNTHETIC DATA · REPRODUCIBLE · NO MODEL SCORING"></div></section>
<section class="panel"><h2 data-vi="01 / Tạo tình huống" data-en="01 / Configure a scenario"></h2><form id="config"><div class="controls">
<label>Offset X (m)<input id="dx" type="number" min="-20" max="20" step="0.5" value="8" required></label><label>Offset Y (m)<input id="dy" type="number" min="-20" max="20" step="0.5" value="0" required></label>
<label><span data-vi="Bắt đầu (s)" data-en="Start (s)"></span><input id="start" type="number" min="0" max="19.5" step="0.5" value="5" required></label><label><span data-vi="Kết thúc (s)" data-en="End (s)"></span><input id="end" type="number" min="0.5" max="20" step="0.5" value="15" required></label>
<label><span data-vi="Trễ nhận (s)" data-en="Reception delay (s)"></span><input id="delay" type="number" min="0" max="2" step="0.25" value="0.25" required></label><label><span data-vi="Bỏ mỗi N bản tin (0 = không bỏ)" data-en="Omit every Nth message (0 = none)"></span><input id="dropEvery" type="number" min="0" max="10" step="1" value="4" required></label></div>
<div class="toolbar"><button type="submit" data-vi="Áp dụng & về đầu" data-en="Apply & reset"></button><button type="button" id="defaults" data-vi="Mặc định" data-en="Defaults"></button><button type="button" id="export" data-vi="Xuất kịch bản JSON" data-en="Export scenario JSON"></button><label class="file"><span data-vi="Nhập kịch bản" data-en="Import scenario"></span><input id="import" type="file" accept=".json,application/json"></label></div></form><p id="notice" role="status"></p><p id="error" role="alert"></p></section>
<section><h2 data-vi="02 / Theo dõi ba góc nhìn" data-en="02 / Follow three perspectives"></h2><div class="toolbar camera-controls"><button id="zoom-in" data-vi="＋ Phóng to" data-en="＋ Zoom in"></button><button id="zoom-out" data-vi="− Thu nhỏ" data-en="− Zoom out"></button><button id="fit-view" data-vi="Vừa khung" data-en="Fit view"></button><output id="zoom-value">1.0×</output><span data-vi="Góc nhìn đồng bộ · tự theo dõi xe" data-en="Synchronized cameras · follows vehicles"></span></div><p class="muted" data-vi="Xanh ngọc: vị trí thật A · Vàng: vị trí khai báo A′ · Xanh dương: xe nhận B. Phóng to chỉ đổi góc nhìn, không đổi tọa độ." data-en="Mint: true position A · Gold: reported position A′ · Blue: receiver B. Zoom changes the view, not coordinates."></p><div class="views"><article class="panel"><h3 data-vi="Vị trí thật" data-en="True position"></h3><button class="expand-view" type="button" aria-expanded="false" data-view="truth" data-vi="Mở rộng khung" data-en="Expand view"></button><div class="viewport" id="truth"></div><p id="truth-value"></p><small data-vi="Xe A · đối chiếu tổng hợp" data-en="Vehicle A · synthetic reference"></small></article><article class="panel"><h3 data-vi="Vị trí khai báo" data-en="Reported position"></h3><button class="expand-view" type="button" aria-expanded="false" data-view="reported" data-vi="Mở rộng khung" data-en="Expand view"></button><div class="viewport" id="reported"></div><p id="reported-value"></p><small data-vi="Glyph A′ không phải một xe khác" data-en="Glyph A′ is not another vehicle"></small></article><article class="panel"><h3 data-vi="Xe nhận quan sát" data-en="Receiver observation"></h3><button class="expand-view" type="button" aria-expanded="false" data-view="observed" data-vi="Mở rộng khung" data-en="Expand view"></button><div class="viewport" id="observed"></div><p id="observed-value"></p><small data-vi="Giữ vị trí từ bản tin nhận gần nhất" data-en="Holds the last received position"></small></article></div>
<div class="panel toolbar playback"><button id="play" data-vi="Phát" data-en="Play"></button><button id="reset" data-vi="Về đầu" data-en="Reset"></button><label for="time" data-vi="Thời gian" data-en="Time"></label><input id="time" type="range" min="0" max="20" step="0.05" value="0"><output id="time-value">0.00 s</output></div><p id="render-status" role="status"></p></section>
<section class="lower"><article class="panel"><h2 data-vi="03 / Kiểm tra hình học" data-en="03 / Geometry checks"></h2><div id="checks"></div><p class="muted" data-vi="Đây là kiểm tra công thức trên dữ liệu biết trước. Không phải detector, đánh giá an toàn hay kết quả benchmark." data-en="These are formula checks on known synthetic data. They are not a detector, safety assessment, or benchmark result."></p></article><article class="panel"><h2 data-vi="Bản tin gần nhất" data-en="Recent messages"></h2><p id="counts"></p><div class="table-wrap"><table><thead><tr><th>ID</th><th data-vi="Phát (s)" data-en="Sent (s)"></th><th data-vi="Nhận (s)" data-en="Received (s)"></th><th data-vi="Trạng thái" data-en="State"></th></tr></thead><tbody id="messages"></tbody></table></div><button id="trace" data-vi="Xuất trace tổng hợp" data-en="Export synthetic trace"></button></article></section>
<details class="panel"><summary data-vi="Công thức, giả định và giới hạn" data-en="Formulas, assumptions and limitations"></summary><p>A(t) = (−30 + 3t, 0) m; B(t) = (0, −20 + 2t) m. p′(t) = p(t) + c khi start ≤ t &lt; end; c = (dx, dy).</p><p data-vi="Một bản tin mỗi giây; trễ cố định, bỏ bản tin theo chu kỳ do người dùng chọn. Không mô phỏng RF, GNSS, chứng chỉ, kích thước xe, va chạm hay phản ứng người lái. Giao cắt của hai điểm không phải bằng chứng tai nạn. Độ lệch triệt tiêu trong sai phân chỉ khi cùng một đoạn có độ lệch cố định. Số liệu và nhãn xe đều được tạo từ công thức; không lấy từ trace thực tế." data-en="One message per second; fixed delay and user-selected periodic omissions. No RF, GNSS, certificates, vehicle dimensions, collisions or driver response are simulated. Crossing point trajectories do not establish a crash. A constant offset cancels in differences only within a segment with that same offset. Values and vehicle labels are authored from formulas, not measured traces."></p><p data-vi="Đổi cấu hình sẽ đưa thời gian về đầu. Xuất kịch bản dùng cấu hình đã áp dụng, không dùng giá trị đang sửa. Tệp nhập được đọc trong trình duyệt; không gửi lên máy chủ." data-en="Applying a configuration resets time. Exports use the applied configuration, not pending edits. Imported files are read in your browser and are not uploaded."></p></details>
