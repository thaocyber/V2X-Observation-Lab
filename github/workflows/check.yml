name: Synthetic public package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_public.py --report /tmp/v2x-public-check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-package-validation
          path: /tmp/v2x-public-check.json
          if-no-files-found: warn
